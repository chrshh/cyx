[package]
name = "zonule"
version = "0.1.0"
edition = "2024"

# zonule is cjyx's Wayland compositor. It starts from Smithay's `smallvil`
# example (the window-management core: state, xdg-shell handlers, move/resize
# grabs, input) but replaces smallvil's nested `winit` backend with a native
# DRM/KMS + libinput + libseat backend so it runs as the real display server on
# the cjyx guest (QEMU virtio-gpu) and on the Raspberry Pi 4 — the same role
# tinywl filled before. Wayland only: no X11, no Xwayland, no winit.

[dependencies]
# fmt-only; no env-filter — we don't need runtime filter parsing.
tracing-subscriber = "0.3.16"
bitflags = "2.2.1"
xcursor = "0.3.10"
thiserror = "2.0.18"
tracing = "0.1.44"

# Pinned to the exact smithay revision the smallvil sources were taken from, so
# the vendored core compiles unchanged. Bump this rev deliberately (and re-check
# the API) rather than tracking a moving branch.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "3021f619e2ae4dab8bfb1e21f3f210923b9b6582"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    # Native backend: session (libseat) -> udev -> DRM/KMS -> GBM -> GLES,
    # with libinput for input. This is the whole point of zonule vs smallvil.
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_egl",
    "use_system_lib",
    "renderer_gl",
]

[features]
# Nested "run it like a normal app" dev backend. OFF by default, so the shipped
# arm64 image never pulls winit or its deps. Enable it on your desktop with
# `cargo run --features dev` to open zonule as a WINDOW inside your existing
# Wayland/X11 session and iterate on window management without booting the OS.
dev = ["smithay/backend_winit"]

# Shipped binary (make display / make run-g): small + fast at runtime, but slow
# to build — fat LTO re-optimizes the whole smithay dep graph on every link and
# codegen-units=1 is single-threaded. Use this for the real image.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Fast iteration profile (build.py --dev / make run-g ZONULE_DEV=1). The point:
# NO lto, so changing zonule never re-optimizes the vendored crates — they
# compile once into target/debug and are reused, and only zonule + a plain link
# are redone. codegen-units defaults high (parallel) and zonule is unoptimized
# for the fastest possible recompile.
[profile.dev]
opt-level = 0
# line tables only: real backtraces on panic without hauling full debuginfo into
# the guest image.
debug = "line-tables-only"

# ...but optimize the dependencies (smithay & co.) at -O2. They're built exactly
# once and cached, so this costs nothing after the first dev build and keeps the
# compositor's runtime smooth even in dev mode.
[profile.dev.package."*"]
opt-level = 2

[package]
name = "squishy"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = { version = "0.14.4", features = ["executor"] }
calloop-wayland-source = "0.4.1"
fontdue = "0.9.3"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["process"] }
rustix = { version = "1.1.4", features = ["pty", "fs", "process", "termios"] }
rustix-openpty = "0.2.0"
smithay-client-toolkit = "0.20.0"
vte = "0.15.0"
wayland-client = "0.31.14"
